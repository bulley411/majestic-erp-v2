services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    command: >
      postgres
      -c shared_buffers=384MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=96MB
      -c max_connections=50
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [internal]

  api:
    image: ghcr.io/bulley411/majestic-erp-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      TZ: UTC
      UPLOAD_DIR: /app/uploads
      NODE_OPTIONS: "--max-old-space-size=768"
      CORS_ORIGIN: https://erp-staging.majesticpensionagent.com
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, dokploy-network]

  web:
    image: ghcr.io/bulley411/majestic-erp-web:latest
    restart: unless-stopped
    depends_on:
      - api
    networks: [internal, dokploy-network]
    labels:
      - "traefik.docker.network=dokploy-network"
      - "traefik.enable=true"
      # Priority — Dokploy will set the actual router name; using 1000 here
      # gives us a fallback above the 200 security rule.
      - "traefik.http.routers.web.priority=1000"
      - "traefik.http.routers.websecure.priority=1000"

volumes:
  db_data:
  redis_data:
  uploads:

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
